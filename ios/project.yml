name: PTTracker
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  PTTracker:
    type: application
    platform: iOS
    sources:
      - PTTracker
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PTTracker
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - PTTrackerTests
  PTTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PTTrackerTests
    dependencies:
      - target: PTTracker
