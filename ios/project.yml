name: PTTracker
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  PTTracker:
    type: application
    platform: iOS
    sources:
      - PTTracker
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PTTracker
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PTTracker/Info.plist
    scheme:
      testTargets:
        - PTTrackerTests
      preActions:
        - name: Start Simulator transcription helper
          script: /bin/zsh "$SRCROOT/../scripts/start_dev_transcription_server.sh"
          settingsTarget: PTTracker
  PTTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PTTrackerTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: PTTracker
